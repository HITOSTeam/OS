[package]
name = "os"
version = "0.1.0"
edition = "2024"

[dependencies]
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
buddy_system_allocator = "0.6"
bitflags = "1.2.1"
xmas-elf = "0.7.0"
fdt = "0.1.5"
virtio-drivers = { path = "../vendor/virtio-drivers" }
ext4-fs = { path = "../ext4-fs" }
log = "0.4"
spin = "0.7.0"
smoltcp = { path = "../vendor/smoltcp", default-features = false, features = [
    "alloc",
    "log",
    "medium-ip",
    "proto-ipv4",
    "socket-tcp",
    "socket-udp",
] }

[target.'cfg(target_arch = "riscv64")'.dependencies]
riscv = "0.15.0"
sbi-rt = { version = "0.0.2", features = ["legacy"] }

[target.'cfg(target_arch = "loongarch64")'.dependencies]
loongArch64 = "0.2.4"

[features]
loongarch_board = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
opt-level = 0           # 优化级别,最低是0,最高是3, 0方便debug
overflow-checks = false # 关闭整数溢出检查
