[package]
name = "os"
version = "0.1.0"
edition = "2024"
# 内核由 src/main.rs 生成；src/lib.rs 只是开发期复用入口，不参与最终 ELF。
autolib = false

[lints.rust]
unreachable_patterns = "warn"
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "warn"
static_mut_refs = "warn"
non_ascii_idents = "deny"

[lints.clippy]
not_unsafe_ptr_arg_deref = "deny"
ptr_cast_constness = "deny"
precedence = "deny"

unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
cast_ptr_alignment = "warn"
arithmetic_side_effects = "warn"

too_many_arguments = "allow"
new_without_default = "allow"
module_inception = "allow"
if_same_then_else = "allow"
many_single_char_names = "allow"

[dependencies]
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
bitflags = "1.2.1"
xmas-elf = "0.7.0"
fdt = "0.1.5"
virtio-drivers = { path = "../vendor/virtio-drivers-pci" }
ext4-fs = { path = "../ext4-fs", default-features = false }
log = "0.4"
spin = "0.7.0"
# WireGuard Noise handshake 与 data message 加密。
blake2 = { version = "0.10", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false }
smoltcp = { path = "../vendor/smoltcp", default-features = false, features = [
    "alloc",
    "log",
    "medium-ip",
    "proto-ipv4",
    # netns、loopback 和 WireGuard 内层包需要 IPv6 地址/包头支持。
    "proto-ipv6",
    "socket-tcp",
    "socket-udp",
    # lo 同时挂 IPv4/IPv6 地址，后续虚拟设备也会继续扩展地址数量。
    "iface-max-addr-count-8",
] }
# WireGuard peer 公钥、临时密钥和 DH shared secret。
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }

[target.'cfg(target_arch = "riscv64")'.dependencies]
riscv = "0.15.0"
sbi-rt = { version = "0.0.2", features = ["legacy"] }

[target.'cfg(target_arch = "loongarch64")'.dependencies]
loongArch64 = "0.2.4"

[features]
loongarch_board = []
perf_diagnostics = ["ext4-fs/block-cache-stats"]
